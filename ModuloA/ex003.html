<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aula 6</title>

    <style>
        body{
            background-color: black;
            color: white;
            font-size: larger;
        }
    </style>
</head>
<body>
    <h1>Olá Mundo!</h1>
    <p>Geraldo Júnior programador</p>

    <script>
        var n1 = Number(window.prompt('Digite um número: '))
        var n2 = Number(window.prompt('Digite um outro número: '))
        var n3 = Number.parseInt(window.prompt('Digite um outro número: '))
        var n4 = Number.parseFloat(window.prompt('Digite um outro número: '))
        var nome = 'Geraldo'
        var soma = n1+n2+n3+n4
        window.alert('A soma é: '+soma)
        window.alert(`Olá ${String(soma)} Bem vindo string`)
        window.alert(`Nome tem:  ${nome.length} letras`)
        window.alert(`Olá ${nome.toLowerCase()} Bem vindo string`)
        window.alert(`Olá ${nome.toUpperCase()} Bem vindo string`)



    </script>
</body>
</html>
