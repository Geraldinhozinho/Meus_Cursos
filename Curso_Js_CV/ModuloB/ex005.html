<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aula 9 - DOM</title>
    <style>
        body{
            background-color: rgb(93, 118, 118);
            color: black;
            font: normal 18pt Arial;
        }
    </style>
</head>
<body>
    
    <h1>Aprendendo o DOM - Document Object Model</h1>
    <p>Conteudo aqui</p>
    <p id="meu_id">Meu nome</p>



    <script>
        var p1 = window.document.getElementsByTagName('p')[0]
        p1.style.color = 'blue'

        var p2 = window.document.getElementById('meu_id')
        p2.style.color = 'yellow'
        p2.innerText = 'Geraldo'
        
    </script>
</body>
</html>
